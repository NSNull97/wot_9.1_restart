[package]
name = "sr-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# TESTVEH-01 stand flag (owner 2026-11-05): build.py gateway --test-lab.
test_lab = []

[dependencies]
# Checkout is independently verified at the pinned commit by the run script.
wg-toolkit = { path = "../../local/vendor/wg-toolkit-rs/wg-toolkit", version = "=0.5.0" }
rsa = "=0.8.2"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
subtle = "=2.6.1"
blowfish = "=0.9.1"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["raw_value"] }

# Test builds: the BW01 worker hashes its own ~290 MB debug test executable before the 10 s handshake;
# unoptimised sha2 does not fit under gate load (CONTENT-0 4). Release is unchanged.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
